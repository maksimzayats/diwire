[project]
name = "diwire"
dynamic = ["version"]
description = "A lightweight, type-safe dependency injection container with automatic wiring, scoped lifetimes, and zero dependencies"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Maksim Zayats", email = "maksim@zayats.dev" }]
keywords = [
    "dependency-injection",
    "di",
    "ioc",
    "inversion-of-control",
    "container",
    "autowiring",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/maksimzayats/diwire"
Documentation = "https://docs.diwire.dev"
Repository = "https://github.com/maksimzayats/diwire"
Issues = "https://github.com/maksimzayats/diwire/issues"


[dependency-groups]
dev = [
    { include-group = "test" },
    "mypy>=2.4.0",
    "pydantic>=2.14.0",
    "litestar>=2.21.1",
    "msgspec>=0.21.1",
    "uvicorn[standard]>=0.46.0",
    "sqlalchemy>=2.0.49",
    "pyinstrument>=5.1.2",
    "prek>=0.3.11",
    "ty>=0.0.34",
    "pyrefly>=0.63.1",
    "py-spy>=0.4.2",
]

# Python 3.13t needs older native dependencies. msgspec and Litestar do not support it.
dev-python313t = [
    { include-group = "test" },
    "mypy>=2.3.0,<2.4.0",
    "ast-serialize>=0.6.0,<0.14.0",
    "pydantic>=2.13.0,<2.15.0",
]

test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "coverage>=7.15.4",
    "ruff>=0.16.1",
    "aiohttp>=3.13.5",
    "celery[redis]>=5.6.3",
    "flask>=3.1.3",
    "django>=5.2.13",
    "pydantic-settings>=2.14.0",
    "fastapi>=0.136.1",
    "typer>=0.25.1",
    "dishka>=1.10.1",
    "rodi>=2.1.0",
    "pytest-benchmark[histogram]>=5.2.3",
    "pytest-asyncio>=1.3.0",
    "uvicorn>=0.46.0",
    "httpx>=0.28.1",
    "attrs>=26.1.0",
    "typing-extensions>=4.15.0",
    "wireup>=2.10.0",
    "django-modern-rest>=0.13.0 ; python_version >= '3.11'",
    "pytest-django>=4.11.1 ; python_version >= '3.11'",
]

docs = [
    "furo>=2025.12.19",
    "sphinx>=8.1.3",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-jsmath>=2.0.0",
    "sphinx-pyodide-runner",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.sdist]
exclude = ["/.agents/performance-evidence"]

# Retain the small fixtures used by the distributed validator tests and workflow.
[tool.hatch.build.targets.sdist.force-include]
".agents/performance-evidence/2026-09-05/h004-calibration.json.gz" = ".agents/performance-evidence/2026-09-05/h004-calibration.json.gz"
".agents/performance-evidence/2026-09-05/h005-allocation.json.gz" = ".agents/performance-evidence/2026-09-05/h005-allocation.json.gz"
".agents/performance-evidence/2026-09-05/h005-linux-protocol.json" = ".agents/performance-evidence/2026-09-05/h005-linux-protocol.json"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[tool.uv]
conflicts = [[{ group = "dev" }, { group = "dev-python313t" }]]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.dependency-groups]
dev-python313t = { requires-python = "==3.13.*" }

[tool.uv.sources]
sphinx-pyodide-runner = { path = "docs/sphinx-pyodide-runner", editable = true }

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
local_partial_types = true
warn_unreachable = true
plugins = ["diwire.integrations.mypy_plugin"]
enable_error_code = [
    "truthy-bool",
    "truthy-iterable",
    "redundant-expr",
    "unused-awaitable",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-self",
    "unimported-reveal",
    "deprecated",
    "exhaustive-match",
]
disable_error_code = [
    "unused-ignore",
    "no-any-return",
]
exclude = [
    "benchmarks/",
    "examples/",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false
disable_error_code = ["valid-type", "misc", "untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    # Ignore ResourceWarnings from unclosed sockets/event loops during GC
    # These come from pytest-asyncio internals and are not related to test code
    "ignore:unclosed <socket.socket:ResourceWarning",
    "ignore:unclosed event loop:ResourceWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/diwire"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = true
