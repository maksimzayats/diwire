name: Benchmarks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      performance_experiment:
        description: Run the frozen H005 experiment instead of competitor reports
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.performance_experiment && 'experiment' || 'report' }}
  cancel-in-progress: ${{ !inputs.performance_experiment }}

jobs:
  benchmarks:
    if: ${{ !inputs.performance_experiment }}
    name: Benchmark Report (Python 3.14)
    runs-on: ubuntu-latest
    env:
      BENCHMARK_ARTIFACT_DIR: benchmark-results/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run benchmark reports
        run: |
          mkdir -p "$(dirname "$BENCHMARK_ARTIFACT_DIR")"
          mkdir "$BENCHMARK_ARTIFACT_DIR"

          uv run pytest tests/benchmarks --benchmark-only -q \
            --benchmark-json="$BENCHMARK_ARTIFACT_DIR/all.json"
          uv run python -m tools.benchmark_reporting \
            --input "$BENCHMARK_ARTIFACT_DIR/all.json" \
            --markdown "$BENCHMARK_ARTIFACT_DIR/benchmark-table.md" \
            --json "$BENCHMARK_ARTIFACT_DIR/benchmark-table.json" \
            --comment "$BENCHMARK_ARTIFACT_DIR/pr-comment.md" \
            --libraries diwire,rodi,dishka,wireup

          uv run pytest \
            tests/benchmarks/test_resolve_transient.py \
            tests/benchmarks/test_resolve_open_generic_transient.py \
            tests/benchmarks/test_resolve_singleton.py \
            tests/benchmarks/test_resolve_deep_transient_chain.py \
            tests/benchmarks/test_resolve_wide_transient_graph.py \
            tests/benchmarks/test_resolve_scoped_with_registered_open_closed_generics.py \
            tests/benchmarks/test_resolve_scoped_with_registered_open_closed_generics_pair_same.py \
            tests/benchmarks/test_resolve_scoped_with_registered_open_closed_generics_pair_alternating.py \
            tests/benchmarks/test_resolve_generated_scoped_grid.py \
            --benchmark-only -q \
            --benchmark-json="$BENCHMARK_ARTIFACT_DIR/resolve.json"
          uv run python -m tools.benchmark_reporting \
            --input "$BENCHMARK_ARTIFACT_DIR/resolve.json" \
            --markdown "$BENCHMARK_ARTIFACT_DIR/benchmark-table-resolve.md" \
            --json "$BENCHMARK_ARTIFACT_DIR/benchmark-table-resolve.json" \
            --comment "$BENCHMARK_ARTIFACT_DIR/pr-comment-resolve.md" \
            --libraries diwire,rodi,dishka,wireup

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/

      - name: Post sticky benchmark comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmark-results
          path: ${{ env.BENCHMARK_ARTIFACT_DIR }}/pr-comment.md

  performance-experiment:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_experiment }}
    name: H005 calibrated allocation experiment (Python 3.14.6)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout experiment controller
        uses: actions/checkout@v5
        with:
          path: controller
          persist-credentials: false

      - name: Checkout frozen subject
        uses: actions/checkout@v5
        with:
          ref: 7eaaf194905675bcd6505b9b434be9748798d3a7
          path: subject
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: false

      - name: Install frozen Python and dependencies
        working-directory: subject
        run: |
          uv python install 3.14.6
          uv sync --locked --python 3.14.6 --group dev --group docs

      - name: Run one bounded calibration and comparison
        working-directory: controller
        run: |
          "$GITHUB_WORKSPACE/subject/.venv/bin/python" -m tests.performance.remote_experiment \
            --subject "$GITHUB_WORKSPACE/subject" \
            --output "$RUNNER_TEMP/h005-performance-experiment" \
            --protocol .agents/performance-evidence/2026-09-05/h005-linux-protocol.json \
            --archive .agents/performance-evidence/2026-09-05/h005-allocation.json.gz

      - name: Upload complete or partial experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h005-performance-experiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h005-performance-experiment/
          if-no-files-found: warn
