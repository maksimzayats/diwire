name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv python install "${UV_PYTHON}"
          if [[ "${UV_PYTHON}" == *t ]]; then
            echo "PYTHON_GIL=0" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: uv sync --locked --group dev --group docs

      - name: Verify runtime and available integrations
        run: |
          uv run --group dev python - <<'PY'
          import importlib
          import os
          import sys
          import sysconfig

          requested = os.environ["UV_PYTHON"]
          assert sys.version_info[:2] == tuple(map(int, requested.rstrip("t").split(".")))
          free_threaded = bool(sysconfig.get_config_var("Py_GIL_DISABLED"))
          assert free_threaded == requested.endswith("t")
          modules = [
              "diwire", "aiohttp", "celery", "django", "fastapi", "flask",
              "litestar", "msgspec", "mypy.build", "pydantic", "pydantic_settings", "typer",
          ]
          for module in modules:
              importlib.import_module(module)
          if free_threaded:
              assert not sys._is_gil_enabled(), "Tests must run with the GIL disabled"
          print(sys.version)
          print("Available integration imports passed")
          PY

      - name: Check formatting
        run: uv run --group dev ruff format --check .

      - name: Lint with ruff
        run: uv run --group dev ruff check .

      - name: Test BB workflow and merge gates
        if: matrix.python-version == '3.14'
        run: node --test .bb/tests/*.test.mjs

      - name: Type check with mypy
        run: uv run --group dev mypy .

      - name: Run tests with coverage
        run: uv run --group dev pytest tests/ --benchmark-disable --cov=src/diwire --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-compose:
    name: E2E ${{ matrix.framework.name }} (Docker Compose, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.14", "3.15", "3.15t" ]
        framework:
          - { name: FastAPI, directory: fastapi }
          - { name: aiohttp, directory: aiohttp }
          - { name: Celery, directory: celery }
          - { name: Litestar, directory: litestar }
          - { name: Flask, directory: flask }
          - { name: Typer, directory: typer }
    env:
      E2E_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run ${{ matrix.framework.name }} e2e tests via Docker Compose
        run: docker compose -f tests/e2e/${{ matrix.framework.directory }}/docker-compose.yml up --build --abort-on-container-exit --exit-code-from tests

      - name: Print Docker Compose logs
        if: always()
        run: docker compose -f tests/e2e/${{ matrix.framework.directory }}/docker-compose.yml logs --no-color

      - name: Tear down Docker Compose services
        if: always()
        run: docker compose -f tests/e2e/${{ matrix.framework.directory }}/docker-compose.yml down --volumes --remove-orphans

  docs:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Docs Build, python-version: "3.13" }
          - { name: "Docs Build (Python 3.15)", python-version: "3.15" }
          - { name: "Docs Build (Python 3.15t)", python-version: "3.15t" }
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group docs

      - name: Build docs
        run: uv run sphinx-build -W -b html docs docs/_build/html
